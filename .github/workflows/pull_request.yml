name: Pull Request

on:
  pull_request:
    branches: [ "main", "develop", "release/*", "hotfix/*" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
              8.0.x
              9.0.x
              10.0.x

      - name: Build
        working-directory: ./
        run: dotnet build -c Release /p:ContinuousIntegrationBuild=true

  test:
    name: Tests on ${{ matrix.os }}
    needs: [ build ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-26, ubuntu-latest, windows-latest ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
              8.0.x
              9.0.x
              10.0.x

      - name: Test
        working-directory: ./
        run: dotnet test --logger:trx --logger:GitHubActions

  benchmark:
    name: Run BenchmarkDotNet
    if: github.event.pull_request.base.ref == 'main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
 
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
 
      - name: Restore dependencies
        run: dotnet restore --no-cache
 
      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore
 
      - name: Start LocalDB
        shell: pwsh
        run: |
          sqllocaldb i
          sqllocaldb start MSSQLLocalDB

      - name: Verify LocalDB
        shell: pwsh
        run: |
          sqllocaldb info MSSQLLocalDB

      - name: Run benchmarks
        shell: pwsh
        run: |
          dotnet run `
            --project benchmarks/DavidGroup.Core.AntiProfanity.Benchmarks/DavidGroup.Core.AntiProfanity.Benchmarks.csproj `
            --configuration Release `
            --no-build `
            -- `
            --exporters json github html csv `
            --artifacts BenchmarkResults `
            -f '*'
 
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: BenchmarkResults/